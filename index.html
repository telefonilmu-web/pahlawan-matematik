<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'"><title>Pahlawan Matematik - Testing</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4faf8;color:#17384a}.wrap{max-width:560px;margin:auto;padding:22px}.hero{background:#082b3d;color:white;padding:24px;border-radius:24px}.card{background:white;margin-top:18px;padding:22px;border-radius:20px;box-shadow:0 8px 30px #0001}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,select,input{width:100%;padding:14px;border-radius:12px;border:1px solid #ccd;font-size:17px;box-sizing:border-box}button{background:#00b982;color:white;font-weight:800;border:0;margin-top:12px}.q{font-size:38px;font-weight:900;text-align:center;margin:25px 0}.feedback{min-height:30px;text-align:center;font-weight:800}.good{color:#008e64}.bad{color:#d32f2f}.hidden{display:none}.stats{display:flex;justify-content:space-between;font-weight:700}</style></head><body><main class="wrap"><section class="hero"><small>VERSI TESTING</small><h1>🐯 Pahlawan Matematik</h1><p>Latihan Matematik interaktif — web LIVE tidak disentuh.</p></section><section class="card" id="setup"><label>Operasi</label><select id="op"><option value="tambah">Tambah</option><option value="tolak">Tolak</option><option value="darab">Darab</option><option value="bahagi">Bahagi</option></select><label>Tahap</label><select id="level"><option value="mudah">Mudah</option><option value="sederhana">Sederhana</option><option value="pro">Pro</option></select><button id="start">Mula 10 Soalan</button></section><section class="card hidden" id="game"><div class="stats"><span id="count"></span><span id="score"></span></div><div class="q" id="question"></div><div id="normal"><input id="answer" inputmode="numeric" autocomplete="off" placeholder="Jawapan"></div><div id="division" class="row hidden"><input id="quotient" inputmode="numeric" placeholder="Hasil bahagi"><input id="remainder" inputmode="numeric" placeholder="Baki"></div><button id="check">Semak</button><div id="feedback" class="feedback"></div><button id="next" class="hidden">Soalan Seterusnya →</button></section><section class="card hidden" id="result"><h2>Keputusan 🏆</h2><div id="summary"></div><button id="again">Latihan Lagi</button></section></main><script type="module" src="./src/app.js"></script></body></html>
